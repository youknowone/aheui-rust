name: Snippet backend matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: snippet-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_BUILD_JOBS: "1"
  RUST_TEST_THREADS: "1"
  LLBC_PARALLEL_LAYOUTS: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only the two checks that need no majit: `cargo fmt` parses, and clippy
      # reads the crates that do not depend on the JIT. Everything else in this
      # workflow compiles against the pinned majit checkout, and neither of
      # these is worth that build.
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Validate pins and script tests
        run: |
          python3 scripts/check_config.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n check.sh aheui-wasm/build.sh

      # `not_unsafe_ptr_arg_deref` and the rest of `clippy::correctness` are
      # deny-by-default, so this fails the run rather than warning: a public
      # safe function that dereferences a raw pointer its caller supplied is
      # the shape it exists to catch.
      - name: cargo clippy
        run: |
          cargo clippy --all-targets \
            -p ahsembler -p compaheuiler -p aheui-runtime -p aheuinterpreter

  jit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The JIT changes span aheui and majit. Keep the checkout in pyre/aheui so
      # extract-llbc.py sees the same sibling layout as a local pyre worktree;
      # Cargo's checked-in CI patch redirects every pinned majit dependency to
      # that checkout.
      #
      # `ref` is a commit id, not a branch: the patch makes this checkout the
      # majit every job below compiles, so a branch here would grade each run
      # against whatever pyre had moved to rather than against the revision
      # Cargo.toml records. It moves with the `rev` in Cargo.toml.
      - name: Check out the pinned majit revision
        uses: actions/checkout@v4
        with:
          repository: youknowone/pyre
          ref: 65ee1d869394553d1bd2a008d73ae5932bfd75a8
          path: pyre

      - name: Check out this aheui revision
        uses: actions/checkout@v4
        with:
          path: pyre/aheui
          submodules: true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo, Charon, LLBC, and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .pyre-build/charon
            pyre/aheui/build/llbc
            pyre/aheui/target
          key: ${{ runner.os }}-aheui-jit-${{ hashFiles('pyre/Cargo.lock', 'pyre/majit/**/Cargo.toml', 'pyre/aheui/Cargo.toml', 'pyre/aheui/**/Cargo.toml', 'pyre/aheui/aheui-runtime/src/**', 'pyre/aheui/aheuinterpreter/src/**') }}
          restore-keys: |
            ${{ runner.os }}-aheui-jit-

      # Every cargo invocation below — the extraction driver's `cargo metadata`,
      # the build Charon runs inside it, and the check and test steps — has to
      # resolve the majit crates the same way, so the patch goes in a config
      # file the whole job reads rather than a `--config` flag one step passes.
      # `Cargo.lock` is not committed, and the driver fingerprints through
      # `cargo metadata --locked`, so mint the lock here under that same patch.
      - name: Point Cargo at the checked-out majit
        working-directory: pyre/aheui
        run: |
          mkdir -p .cargo
          cp .github/majit-ci-config.toml .cargo/config.toml
          cargo generate-lockfile

      - name: Install Charon and extract the JIT inputs
        working-directory: pyre
        run: |
          python3 scripts/install-charon.py
          python3 aheui/scripts/extract-llbc.py

      # `--no-fail-fast` so one failing binary does not hide the rest, and
      # RUST_BACKTRACE because a panic raised while the metainterp is tracing
      # is reported as an abort with no frame to name it.
      - name: Check and test the dynasm JIT
        working-directory: pyre/aheui
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo check --workspace --features dynasm
          cargo test --workspace --features dynasm --no-fail-fast

      - name: Check release JIT behavior and optimization baselines
        working-directory: pyre/aheui
        run: |
          cargo build --release -p aheui --no-default-features --features jit,dynasm,malachite-bigint
          python3 scripts/jitstats.py check
          python3 scripts/jitstats.py sweep
          python3 scripts/opcensus.py check

      - name: Check WASI JIT execution
        working-directory: pyre/aheui
        run: |
          rustup target add wasm32-wasip1
          cargo build --release -p aheui-wasm-runner
          cargo build --release -p aheui --target wasm32-wasip1 --no-default-features --features jit,naive,malachite-bigint,wasm-host
          python3 scripts/check_wasi.py

  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo inputs and shared build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-snippet-matrix-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-snippet-matrix-

      - name: Build, verify, and time all six backends
        id: matrix
        continue-on-error: true
        run: python3 scripts/snippet_matrix.py --report target/snippet-matrix/report.md

      - name: Add report to the job summary
        if: always() && hashFiles('target/snippet-matrix/report.md') != ''
        run: cat target/snippet-matrix/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request report
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('target/snippet-matrix/report.md') != ''
        uses: actions/github-script@v7
        env:
          REPORT_PATH: target/snippet-matrix/report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- aheui-snippet-matrix -->';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload the report
        if: always() && hashFiles('target/snippet-matrix/report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snippet-backend-matrix
          path: target/snippet-matrix/report.md

      - name: Fail when a backend or snippet failed
        if: steps.matrix.outcome == 'failure'
        run: exit 1
