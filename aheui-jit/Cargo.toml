[package]
name = "aheui-jit"
version = "0.0.1"
edition = "2024"

[features]
default = ["malachite-bigint", "dynasm"]
num-bigint = ["aheui-runtime/num-bigint"]
malachite-bigint = ["aheui-runtime/malachite-bigint"]
cranelift = ["dep:majit-backend-cranelift", "majit-metainterp/cranelift"]
dynasm = ["dep:majit-backend-dynasm", "majit-metainterp/dynasm"]

[dependencies]
aheui-runtime = { path = "../aheui-runtime" }
ahsembler = { path = "../ahsembler" }
majit-ir = { path = "../../majit/majit-ir" }
majit-macros = { path = "../../majit/majit-macros" }
majit-gc = { path = "../../majit/majit-gc" }
majit-metainterp = { path = "../../majit/majit-metainterp" }
majit-translate = { path = "../../majit/majit-translate" }
majit-backend = { path = "../../majit/majit-backend" }
majit-backend-cranelift = { path = "../../majit/majit-backend-cranelift", optional = true }
majit-backend-dynasm = { path = "../../majit/majit-backend-dynasm", optional = true }
bincode = "1.3"

[build-dependencies]
majit-translate = { path = "../../majit/majit-translate" }
serde_json = "1"
bincode = "1.3"
syn = { version = "2", features = ["full", "visit"] }
