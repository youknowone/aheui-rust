[package]
name = "aheui-jit"
version = "0.0.1"
edition = "2024"

[features]
default = ["malachite-bigint", "dynasm"]
# Set by the three backend features; means a big-integer backend is selected. Nothing enables it directly.
bigint-backend = []
num-bigint = ["aheui-runtime/num-bigint", "bigint-backend"]
malachite-bigint = ["aheui-runtime/malachite-bigint", "bigint-backend"]
runtime-rbigint = ["aheui-runtime/runtime-rbigint", "bigint-backend"]
cranelift = ["dep:majit-backend-cranelift", "majit-metainterp/cranelift"]
dynasm = ["dep:majit-backend-dynasm", "majit-metainterp/dynasm"]

[dependencies]
aheui-runtime = { path = "../aheui-runtime", features = ["jit"], default-features = false }
ahsembler = { path = "../ahsembler" }
majit-ir = { workspace = true }
majit-macros = { workspace = true }
# `gc_box`: the compiled `New` op has to allocate Nodes out of the interpreter's
# shared nursery, so this crate installs a `NurseryGcAllocator` box through
# `set_gc_allocator` instead of taking the `install_gc_standalone` path that
# allocates from the `gc_sync` singleton. Without the feature every box query
# answers a constant `false` and installing one panics.
majit-gc = { workspace = true, features = ["gc_box"] }
majit-metainterp = { workspace = true }
majit-translate = { workspace = true }
majit-backend = { workspace = true }
majit-backend-cranelift = { workspace = true, optional = true }
majit-backend-dynasm = { workspace = true, optional = true }
bincode = "1.3"

[build-dependencies]
majit-translate = { workspace = true }
serde_json = "1"
bincode = "1.3"
syn = { version = "2", features = ["full", "visit"] }
