[package]
name = "compaheuiler"
version = "0.0.1"
edition = "2024"
description = "컴파흴러. 아희 네희티브 컴파일러 - Aheui compiler"
license = "AGPL-3.0-or-later"
repository = "https://github.com/youknowone/aheui-rust"
keywords = ["aheui", "compiler", "esoteric", "hangul"]
categories = ["compilers"]

[features]
default = ["malachite-bigint"]
bigint = ["dep:num-traits", "dep:malachite-bigint"]
num-bigint = ["bigint", "dep:num-bigint"]
malachite-bigint = ["bigint"]
cranelift = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dependencies]
ahsembler = { path = "../ahsembler", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }

num-bigint = { version = "0.4", optional = true }
malachite-bigint = { version = "0.9", optional = true }
num-traits = { version = "0.2", optional = true }

cranelift-codegen = { version = "0.130", optional = true }
cranelift-frontend = { version = "0.130", optional = true }
cranelift-jit = { version = "0.130", optional = true }
cranelift-module = { version = "0.130", optional = true }
cranelift-native = { version = "0.130", optional = true }

[dev-dependencies]
wat = "1.227"
